[package]
name = "fuzzer"
version = "0.1.0"
edition = "2024"

[profile.release]
incremental = false
debug = 0
strip = true

[dependencies]
libafl = { version = "=0.15.3", features = ["multipart_inputs", "std", "cli"] }
libafl_bolts = "=0.15.3"
libafl_qemu = {
    version = "=0.15.3",
    features = ["usermode", "x86_64"]
}
libc = "=0.2"
serde = { version = "1", features = ["derive"] }
goblin = "=0.8"
serde_json = "1.0"
rand = "=0.9"
